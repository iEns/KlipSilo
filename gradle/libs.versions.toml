[versions]
agp = "9.2.1"
kotlin = "2.2.10"
composeBom = "2024.12.01"
room = "2.8.4"
navigation = "2.8.5"
lifecycle = "2.8.7"
datastore = "1.1.1"
coroutines = "1.9.0"
coreKtx = "1.15.0"
appcompat = "1.7.1"
